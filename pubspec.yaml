name: tasmee3_trainer
description: "Quran Tasmee3 - Offline-first Quran memorization testing app with on-device streaming ASR and SM-2 spaced repetition review."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Core engine (pure Dart, path dependency)
  quran_tasmee3_core:
    path: packages/quran_tasmee3_core

  # State management
  flutter_riverpod: 2.5.1

  # Local storage
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0

  # HTTP client (for potential future API calls)
  http: 1.5.0

  # Local DB for session logs
  sqflite: 2.4.1

  # Path provider (for sqflite database path)
  path_provider: 2.1.5

  # On-device ASR (spec section 4 — locked stack)
  # onnxruntime: direct FFI bindings to libonnxruntime.so. NO sherpa_onnx.
  onnxruntime: 1.4.1
  # record: microphone capture (PCM16, 16kHz, mono) for live mic mode.
  record: ^5.1.3
  # ffi: required by onnxruntime package for dart:ffi bindings.
  ffi: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/quran/
    - assets/images/
    # ASR model assets (gitignored — 175MB model is NOT committed)
    # These are bundled into the APK for on-device inference.
    - assets/models/asr/tokens.txt
    - assets/models/asr/test_fatihah.wav
    - assets/models/asr/test_ikhlas.wav
    # NOTE: model_int8.onnx (175MB) is listed separately below to avoid
    # accidentally bundling it into web builds. On mobile it's included.
    - assets/models/asr/model_int8.onnx

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
