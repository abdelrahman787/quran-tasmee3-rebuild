name: tasmee3_trainer
description: "Quran Tasmee3 - Offline-first Quran memorization testing app with on-device streaming ASR and SM-2 spaced repetition review."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Core engine (pure Dart, path dependency)
  quran_tasmee3_core:
    path: packages/quran_tasmee3_core

  # State management
  flutter_riverpod: 2.5.1

  # Local storage
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0

  # HTTP client (for potential future API calls)
  http: 1.5.0

  # Local DB for session logs
  sqflite: 2.4.1

  # Path provider (for sqflite database path)
  path_provider: 2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/quran/
    - assets/images/
